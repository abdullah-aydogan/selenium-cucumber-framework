name: Automation Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Automated E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Execute Tests (Chrome Headless)
        run: mvn clean test -Dbrowser=chrome-headless
        continue-on-error: true

      - name: Upload Cucumber HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-reports/
          retention-days: 14

      # 1. Mevcut gh-pages geçmişini çekmeyi dene (ilk koşumda dal yoksa hata vermeden geçer)
      - name: Get Allure History
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 2. Gerekli dizinleri ve sonuç dosyalarını garantiye al
      - name: Prepare Allure Directories
        if: always()
        run: |
          mkdir -p gh-pages
          mkdir -p allure-results
          # Sonuçlar target altına yazıldıysa kök dizine taşı
          if [ -d "target/allure-results" ]; then
            cp -r target/allure-results/* allure-results/ 2>/dev/null || true
          fi

      # 3. Allure Raporunu Derle
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        id: allure-report
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 25

      # 4. Sadece allure-history klasörü başarıyla oluştuktan sonra GitHub Pages'e yükle
      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history